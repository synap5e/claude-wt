[project]
name = "claude-wt"
version = "0.1.0"
description = "Launch a coding agent in a throwaway git worktree, pinned there by a git shim and (where available) a bubblewrap sandbox"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Simon Pinfold", email = "synap5e@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
claude-wt = "claude_wt.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest", "basedpyright>=1.24.0", "ruff>=0.8.0"]

[tool.ruff]
line-length = 120
preview = true

[tool.ruff.lint]
select = [
    "E",
    "F",
    "UP",
    "B",
    "SIM",
    "I",
    "PLC0415",
    "BLE001",
    "PLR1702",
    "PLR0917",
    "PLR0916",
    "PLR0913",
    "C901",
]
ignore = ["SIM108"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*.py" = ["BLE001"]

[tool.ruff.lint.isort]
force-single-line = false
combine-as-imports = true
split-on-trailing-comma = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.basedpyright]
reportUnusedCallResult = false
reportImplicitStringConcatenation = false
reportUnannotatedClassAttribute = false
reportUnknownLambdaType = false
reportAny = false
reportExplicitAny = false
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/node_modules", "**/.git"]
